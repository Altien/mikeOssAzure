<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="doorFace" x1="9" y1="4" x2="30" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C6CEDA"/>
      <stop offset="0.5" stop-color="#9AA4B2"/>
      <stop offset="1" stop-color="#6E7887"/>
    </linearGradient>
    <linearGradient id="panelFace" x1="13.5" y1="11" x2="26.5" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#69737F"/>
      <stop offset="1" stop-color="#8E99A8"/>
    </linearGradient>
    <linearGradient id="frameBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5D6674"/>
      <stop offset="1" stop-color="#39424E"/>
    </linearGradient>
    <linearGradient id="doorway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9E1EA"/>
      <stop offset="0.55" stop-color="#F2F6FA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3E9EF"/>
      <stop offset="1" stop-color="#7B8593"/>
    </linearGradient>
    <linearGradient id="knobFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#939EAC"/>
    </linearGradient>
  </defs>

  <!-- casing and the dark room beyond; the opening stays wider than the swung leaf -->
  <path d="M28 5 L58 5 Q60.5 5 60.5 7.5 L60.5 55.5 Q60.5 57.5 58.5 57.5 L57.5 57.5 Q56 57.5 56 56 L56 11 Q56 9 54 9 L32 9 Q30 9 30 11 L30 56 Q30 57.5 28.5 57.5 L27.5 57.5 Q25.5 57.5 25.5 55.5 L25.5 7.5 Q25.5 5 28 5 Z"
        fill="url(#frameBody)" stroke="#2B333E" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M30 11 Q30 9 32 9 L54 9 Q56 9 56 11 L56 57.5 L30 57.5 Z" fill="url(#doorway)"/>
  <path d="M31.5 53.5 H54.5" fill="none" stroke="#8A94A2" stroke-width="1.6" stroke-linecap="round"/>

  <!-- leaf swung outwards: the free edge is nearer the viewer, so it stands taller -->
  <path d="M11.43 4.58 L27.57 8.42 Q30 9 30 11.5 L30 54.5 Q30 57 27.54 57.47 L11.46 60.53 Q9 61 9 58.5 L9 6.5 Q9 4 11.43 4.58 Z"
        fill="url(#doorFace)" stroke="#2B333E" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- recessed panels -->
  <g fill="url(#panelFace)">
    <path d="M14.98 11.97 L25.03 13.83 Q26.5 14.1 26.5 15.6 L26.5 29 Q26.5 30.5 25 30.43 L15 29.97 Q13.5 29.9 13.5 28.4 L13.5 13.2 Q13.5 11.7 14.98 11.97 Z"/>
    <path d="M15 35.4 L25 35.4 Q26.5 35.4 26.5 36.9 L26.5 50.2 Q26.5 51.7 25.01 51.91 L14.99 53.29 Q13.5 53.5 13.5 52 L13.5 36.9 Q13.5 35.4 15 35.4 Z"/>
  </g>

  <!-- slim hinge knuckles on the jamb edge, knob on the free stile -->
  <g fill="url(#metal)" stroke="#2B333E" stroke-width="0.6">
    <rect x="28.9" y="15.5" width="2.2" height="5.5" rx="1.1"/>
    <rect x="28.9" y="44" width="2.2" height="5.5" rx="1.1"/>
  </g>
  <circle cx="11.5" cy="33.2" r="2.6" fill="url(#knobFace)" stroke="#2B333E" stroke-width="0.9"/>
</svg>
