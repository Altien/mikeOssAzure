<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">Mike OSS endorsement lock-up colour variants</title>
  <desc id="desc">Six variants combining the canonical Mike mark with a rainbow heart, by Altien, and Microsoft Azure.</desc>
  <defs>
    <path id="blade" d="M 40,0 A 4,4 0 0 1 43,-3 Q 95,-22 147,-3 A 4,4 0 0 1 150,0 A 4,4 0 0 1 147,3 Q 95,22 43,3 A 4,4 0 0 1 40,0 Z"/>
    <path id="heart" d="M 0,-26 C -38,-68 -96,-42 -96,12 C -96,54 -50,84 0,122 C 50,84 96,54 96,12 C 96,-42 38,-68 0,-26 Z"/>
    <clipPath id="heart-clip"><use href="#heart"/></clipPath>
    <style>
      .panel { fill: #fff; stroke: #dfe5ec; stroke-width: 2; }
      .label { fill: #7b8795; font: 600 21px "Segoe UI", Arial, sans-serif; letter-spacing: 1.3px; }
      .name { font: 700 67px "Segoe UI", Arial, sans-serif; letter-spacing: -2.5px; }
      .endorsement { font: 600 31px "Segoe UI", Arial, sans-serif; }
      .azure { font: 500 30px "Segoe UI", Arial, sans-serif; }
      .note { fill: #8a95a3; font: 400 18px "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1800" height="1320" fill="#f4f6f9"/>
  <text x="42" y="30" fill="#293a51" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.8">MIKE OSS × ALTIEN × MICROSOFT AZURE — COLOUR STUDIES</text>

  <!-- A: full current Mike spectrum, restrained endorsement -->
  <g transform="translate(40 50)">
    <rect class="panel" width="840" height="390" rx="24"/>
    <text class="label" x="28" y="40">A · MIKE SPECTRUM + FOUR-BAND HEART</text>
    <g transform="translate(125 190) scale(.56)">
      <use href="#blade" fill="#16c7e8" transform="rotate(0)"/><use href="#blade" fill="#11d8d1" transform="rotate(30)"/>
      <use href="#blade" fill="#16e59a" transform="rotate(60)"/><use href="#blade" fill="#58e84b" transform="rotate(90)"/>
      <use href="#blade" fill="#b7ee18" transform="rotate(120)"/><use href="#blade" fill="#f2ea00" transform="rotate(150)"/>
      <use href="#blade" fill="#ffb21c" transform="rotate(180)"/><use href="#blade" fill="#ff6f3c" transform="rotate(210)"/>
      <use href="#blade" fill="#f23baa" transform="rotate(240)"/><use href="#blade" fill="#e000c8" transform="rotate(270)"/>
      <use href="#blade" fill="#a84dff" transform="rotate(300)"/><use href="#blade" fill="#4e74ff" transform="rotate(330)"/>
    </g>
    <text class="name" x="245" y="179" fill="#293a51">Mike OSS</text>
    <g transform="translate(266 244) scale(.18)">
      <g clip-path="url(#heart-clip)">
        <rect x="-100" y="-70" width="50" height="205" fill="#16c7e8"/><rect x="-50" y="-70" width="50" height="205" fill="#20e19a"/>
        <rect x="0" y="-70" width="50" height="205" fill="#d7ef00"/><rect x="50" y="-70" width="50" height="205" fill="#e000c8"/>
      </g>
    </g>
    <text class="endorsement" x="300" y="260" fill="#293a51">by Altien</text>
    <line x1="445" y1="224" x2="445" y2="268" stroke="#cbd2db" stroke-width="2"/>
    <text class="azure" x="470" y="260" fill="#6b7989">Microsoft Azure</text>
    <text class="note" x="245" y="326">Maximum Mike colour; calm partner line.</text>
  </g>

  <!-- B: restrained current Mike mark, spectrum heart -->
  <g transform="translate(920 50)">
    <rect class="panel" width="840" height="390" rx="24"/>
    <text class="label" x="28" y="40">B · NAVY MIKE + FULL-SPECTRUM HEART</text>
    <g transform="translate(125 190) scale(.56)">
      <use href="#blade" fill="#293a51" transform="rotate(0)"/><use href="#blade" fill="#16c7e8" transform="rotate(30)"/>
      <use href="#blade" fill="#20e19a" transform="rotate(60)"/><use href="#blade" fill="#d7ef00" transform="rotate(90)"/>
      <use href="#blade" fill="#e000c8" transform="rotate(120)"/><use href="#blade" fill="#293a51" transform="rotate(150)"/>
      <use href="#blade" fill="#293a51" transform="rotate(180)"/><use href="#blade" fill="#293a51" transform="rotate(210)"/>
      <use href="#blade" fill="#293a51" transform="rotate(240)"/><use href="#blade" fill="#293a51" transform="rotate(270)"/>
      <use href="#blade" fill="#293a51" transform="rotate(300)"/><use href="#blade" fill="#293a51" transform="rotate(330)"/>
    </g>
    <text class="name" x="245" y="179" fill="#293a51">Mike OSS</text>
    <g transform="translate(266 244) scale(.18)">
      <g clip-path="url(#heart-clip)">
        <rect x="-100" y="-70" width="34" height="205" fill="#16c7e8"/><rect x="-66" y="-70" width="33" height="205" fill="#16e59a"/>
        <rect x="-33" y="-70" width="33" height="205" fill="#b7ee18"/><rect x="0" y="-70" width="33" height="205" fill="#ffb21c"/>
        <rect x="33" y="-70" width="33" height="205" fill="#f23baa"/><rect x="66" y="-70" width="34" height="205" fill="#a84dff"/>
      </g>
    </g>
    <text class="endorsement" x="300" y="260" fill="#293a51">by Altien</text>
    <line x1="445" y1="224" x2="445" y2="268" stroke="#16c7e8" stroke-width="3"/>
    <text class="azure" x="470" y="260" fill="#0078d4">Microsoft Azure</text>
    <text class="note" x="245" y="326">The cleanest corporate version; colour lives in the endorsement.</text>
  </g>

  <!-- C: colours sampled from the supplied Altien wordmark -->
  <g transform="translate(40 465)">
    <rect class="panel" width="840" height="390" rx="24"/>
    <text class="label" x="28" y="40">C · ALTIEN HERITAGE RAINBOW</text>
    <g transform="translate(125 190) scale(.56)">
      <use href="#blade" fill="#3850a8" transform="rotate(0)"/><use href="#blade" fill="#0090c8" transform="rotate(30)"/>
      <use href="#blade" fill="#50c0a0" transform="rotate(60)"/><use href="#blade" fill="#68c040" transform="rotate(90)"/>
      <use href="#blade" fill="#f0e818" transform="rotate(120)"/><use href="#blade" fill="#e82848" transform="rotate(150)"/>
      <use href="#blade" fill="#e03090" transform="rotate(180)"/><use href="#blade" fill="#3850a8" transform="rotate(210)"/>
      <use href="#blade" fill="#0090c8" transform="rotate(240)"/><use href="#blade" fill="#50c0a0" transform="rotate(270)"/>
      <use href="#blade" fill="#f0e818" transform="rotate(300)"/><use href="#blade" fill="#e03090" transform="rotate(330)"/>
    </g>
    <text class="name" x="245" y="179" fill="#3850a8">Mike OSS</text>
    <g transform="translate(266 244) scale(.18)">
      <g clip-path="url(#heart-clip)">
        <rect x="-100" y="-70" width="34" height="205" fill="#0090c8"/><rect x="-66" y="-70" width="33" height="205" fill="#50c0a0"/>
        <rect x="-33" y="-70" width="33" height="205" fill="#68c040"/><rect x="0" y="-70" width="33" height="205" fill="#f0e818"/>
        <rect x="33" y="-70" width="33" height="205" fill="#e82848"/><rect x="66" y="-70" width="34" height="205" fill="#e03090"/>
      </g>
    </g>
    <text class="endorsement" x="300" y="260" fill="#3850a8">by Altien</text>
    <line x1="445" y1="224" x2="445" y2="268" stroke="#cbd2db" stroke-width="2"/>
    <text class="azure" x="470" y="260" fill="#5267ad">Microsoft Azure</text>
    <text class="note" x="245" y="326">Directly echoes the supplied blue Altien logo and its colour tabs.</text>
  </g>

  <!-- D: heritage blue led, small rainbow flare -->
  <g transform="translate(920 465)">
    <rect class="panel" width="840" height="390" rx="24"/>
    <text class="label" x="28" y="40">D · ALTIEN BLUE + HERITAGE FLARE</text>
    <g transform="translate(125 190) scale(.56)">
      <use href="#blade" fill="#3850a8" transform="rotate(0)"/><use href="#blade" fill="#3850a8" transform="rotate(30)"/>
      <use href="#blade" fill="#3850a8" transform="rotate(60)"/><use href="#blade" fill="#0090c8" transform="rotate(90)"/>
      <use href="#blade" fill="#50c0a0" transform="rotate(120)"/><use href="#blade" fill="#68c040" transform="rotate(150)"/>
      <use href="#blade" fill="#f0e818" transform="rotate(180)"/><use href="#blade" fill="#e82848" transform="rotate(210)"/>
      <use href="#blade" fill="#e03090" transform="rotate(240)"/><use href="#blade" fill="#3850a8" transform="rotate(270)"/>
      <use href="#blade" fill="#3850a8" transform="rotate(300)"/><use href="#blade" fill="#3850a8" transform="rotate(330)"/>
    </g>
    <text class="name" x="245" y="179" fill="#3850a8">Mike OSS</text>
    <g transform="translate(266 244) scale(.18)">
      <use href="#heart" fill="#e03090"/>
    </g>
    <text class="endorsement" x="300" y="260" fill="#3850a8">by Altien</text>
    <line x1="445" y1="224" x2="445" y2="268" stroke="#3850a8" stroke-width="2"/>
    <text class="azure" x="470" y="260" fill="#6b7989">Microsoft Azure</text>
    <g transform="translate(245 296)">
      <rect width="44" height="5" fill="#0090c8"/><rect x="44" width="44" height="5" fill="#50c0a0"/><rect x="88" width="44" height="5" fill="#68c040"/>
      <rect x="132" width="44" height="5" fill="#f0e818"/><rect x="176" width="44" height="5" fill="#e82848"/><rect x="220" width="44" height="5" fill="#e03090"/>
    </g>
    <text class="note" x="245" y="335">Feels closest to the older Altien identity without looking retro.</text>
  </g>

  <!-- E: full current spectrum and brighter product typography -->
  <g transform="translate(40 880)">
    <rect class="panel" width="840" height="390" rx="24"/>
    <text class="label" x="28" y="40">E · MIKE SPECTRUM + COLOUR PRODUCT ACCENT</text>
    <g transform="translate(125 190) scale(.56)">
      <use href="#blade" fill="#16c7e8" transform="rotate(0)"/><use href="#blade" fill="#11d8d1" transform="rotate(30)"/>
      <use href="#blade" fill="#16e59a" transform="rotate(60)"/><use href="#blade" fill="#58e84b" transform="rotate(90)"/>
      <use href="#blade" fill="#b7ee18" transform="rotate(120)"/><use href="#blade" fill="#f2ea00" transform="rotate(150)"/>
      <use href="#blade" fill="#ffb21c" transform="rotate(180)"/><use href="#blade" fill="#ff6f3c" transform="rotate(210)"/>
      <use href="#blade" fill="#f23baa" transform="rotate(240)"/><use href="#blade" fill="#e000c8" transform="rotate(270)"/>
      <use href="#blade" fill="#a84dff" transform="rotate(300)"/><use href="#blade" fill="#4e74ff" transform="rotate(330)"/>
    </g>
    <text class="name" x="245" y="179"><tspan fill="#293a51">Mike </tspan><tspan fill="#4e74ff">OSS</tspan></text>
    <g transform="translate(266 244) scale(.18)">
      <g clip-path="url(#heart-clip)">
        <rect x="-100" y="-70" width="100" height="205" fill="#16c7e8"/><rect x="0" y="-70" width="100" height="205" fill="#e000c8"/>
      </g>
    </g>
    <text class="endorsement" x="300" y="260" fill="#293a51">by Altien</text>
    <line x1="445" y1="224" x2="445" y2="268" stroke="#a84dff" stroke-width="3"/>
    <text class="azure" x="470" y="260" fill="#0078d4">Microsoft Azure</text>
    <text class="note" x="245" y="326">More energetic; useful for launch graphics rather than the master logo.</text>
  </g>

  <!-- F: minimum colour, distinctive endorsement -->
  <g transform="translate(920 880)">
    <rect class="panel" width="840" height="390" rx="24"/>
    <text class="label" x="28" y="40">F · QUIET MIKE + THREE-COLOUR SIGNATURE</text>
    <g transform="translate(125 190) scale(.56)">
      <use href="#blade" fill="#293a51" transform="rotate(0)"/><use href="#blade" fill="#293a51" transform="rotate(30)"/>
      <use href="#blade" fill="#16c7e8" transform="rotate(60)"/><use href="#blade" fill="#d7ef00" transform="rotate(90)"/>
      <use href="#blade" fill="#e000c8" transform="rotate(120)"/><use href="#blade" fill="#293a51" transform="rotate(150)"/>
      <use href="#blade" fill="#293a51" transform="rotate(180)"/><use href="#blade" fill="#293a51" transform="rotate(210)"/>
      <use href="#blade" fill="#293a51" transform="rotate(240)"/><use href="#blade" fill="#293a51" transform="rotate(270)"/>
      <use href="#blade" fill="#293a51" transform="rotate(300)"/><use href="#blade" fill="#293a51" transform="rotate(330)"/>
    </g>
    <text class="name" x="245" y="179" fill="#293a51">Mike OSS</text>
    <g transform="translate(266 244) scale(.18)">
      <g clip-path="url(#heart-clip)">
        <rect x="-100" y="-70" width="67" height="205" fill="#16c7e8"/><rect x="-33" y="-70" width="66" height="205" fill="#d7ef00"/>
        <rect x="33" y="-70" width="67" height="205" fill="#e000c8"/>
      </g>
    </g>
    <text class="endorsement" x="300" y="260" fill="#293a51">by Altien</text>
    <line x1="445" y1="224" x2="445" y2="268" stroke="#dfe5ec" stroke-width="2"/>
    <text class="azure" x="470" y="260" fill="#293a51">Microsoft Azure</text>
    <text class="note" x="245" y="326">Most compact and legible at small sizes.</text>
  </g>
</svg>
