  <desc id="desc">A mark-only Marketplace icon shown beside the separate compliant offer title.</desc>
  <defs>
    <path id="blade" d="M 40,0 A 4,4 0 0 1 43,-3 Q 95,-22 147,-3 A 4,4 0 0 1 150,0 A 4,4 0 0 1 147,3 Q 95,22 43,3 A 4,4 0 0 1 40,0 Z"/>
  </defs>
  <rect width="1400" height="420" fill="#F5F7FA"/>
  <rect x="70" y="60" width="300" height="300" rx="34" fill="#293A51"/>
  <g transform="translate(220 210) scale(.68)">
    <use href="#blade" fill="#16C7E8" transform="rotate(0)"/><use href="#blade" fill="#20E19A" transform="rotate(30)"/><use href="#blade" fill="#D7EF00" transform="rotate(60)"/><use href="#blade" fill="#E000C8" transform="rotate(90)"/>
    <use href="#blade" fill="#16C7E8" transform="rotate(120)"/><use href="#blade" fill="#20E19A" transform="rotate(150)"/><use href="#blade" fill="#D7EF00" transform="rotate(180)"/><use href="#blade" fill="#E000C8" transform="rotate(210)"/>
