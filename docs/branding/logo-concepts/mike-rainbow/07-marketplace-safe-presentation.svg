  </g>
  <text x="450" y="155" fill="#6B7989" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="2">MICROSOFT MARKETPLACE OFFER</text>
  <text x="450" y="235" fill="#293A51" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-2">Mike OSS by Altien</text>
  <text x="450" y="305" fill="#293A51" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="500">for Azure</text>
