name: security

on:
  push:
    branches: [main]
  pull_request:

# Don't pile up runs on rapid pushes to the same PR: a new push cancels the
# superseded run so it stops holding job slots (the org's concurrent-job cap is
# shared by every workflow). Pushes to main each get their own group (keyed by
# sha) and are never cancelled.
concurrency:
  group: security-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Least privilege for the job token: this workflow only reads the repo and
# queries the npm registry — it never writes to the repo, issues, or checks.
# Without this block the job token inherits the repository default, which
# may be broader; OpenSSF Scorecard's Token-Permissions check verifies it.
permissions:
  contents: read

jobs:
  # The gate's own regression suite. It asserts the FAIL-CLOSED contract —
  # every bug this script has had was a path where "we could not check"
  # printed the same "passed" as "we checked and it is clean" — and it runs
  # against stub servers, so it needs no network and no install. Kept as its
  # own job rather than a step in the matrix below so it runs once, and so a
  # broken gate is legible as a broken gate rather than as four failing
  # workspace audits.
  audit-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Audit gate self-tests
        run: node --test scripts/audit-gate.test.mjs

  # Blocking for EVERY tree in the matrix below: high/critical advisories
  # fail the build unless their GHSA id is documented (with a reason) in
  # scripts/audit-allowlist.json — see scripts/pnpm-audit-gate.mjs. Auditing
  # straight from the pnpm lockfile needs no dependency install.
  # Advisories with no non-breaking fix anywhere in the ecosystem get an
  # allowlist entry instead of demoting the whole job to report-only (which
  # would hide new advisories too); Dependabot (added in this PR) surfaces
  # the upstream releases that let entries be removed.
  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      # Report every affected workspace; one vulnerable tree must not cancel
      # the remaining audits and hide other updates that need attention.
      fail-fast: false
      matrix:
        # The Dev fork has exactly three pnpm lock trees. No root package exists.
        include:
          - workspace: backend
            dir: backend
          - workspace: frontend
            dir: frontend
          - workspace: word-addin
            dir: word-addin
    name: dependency-audit (${{ matrix.workspace }})
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      # Pinned to commit SHAs, not tags — repo-wide posture since #246:
      # tags are mutable, so a compromised action repo could silently swap
      # what "v4" points at; a 40-char SHA cannot be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify audited lock trees
        run: |
          actual="$(find "$GITHUB_WORKSPACE" -name pnpm-lock.yaml -not -path '*/node_modules/*' -printf '%P\n' | sort)"
          expected="$(printf 'backend/pnpm-lock.yaml\nfrontend/pnpm-lock.yaml\nword-addin/pnpm-lock.yaml' | sort)"
          test "$actual" = "$expected"
      - name: Enable pnpm
        run: corepack enable
      - name: Dependency security audit
        run: node "$GITHUB_WORKSPACE/scripts/pnpm-audit-gate.mjs"
