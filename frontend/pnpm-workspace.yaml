  'vite@>=6 <7': 6.4.5
  'vite@>=8 <9': 8.3.5
  rolldown: 1.2.14
  postcss: 8.5.31
  'nanoid@>=3 <4': 3.3.20
  # Source177 npm lock security delta, retained in Dev pnpm resolution.
  markdown-it: ^14.3.3
  '@node-minify/core>glob': ^10.5.0
  eslint-plugin-react-hooks: ~7.0.1
